# Materials database. Schema: materials/README.md. Loader/validator: materials/db.py.
# Every value carries a source. Proxies (data borrowed from a comparable product) are ASSUMPTION.
schema_version: 1
materials:

  # ------------------------------------------------------------------ refractory
  - id: refarom_65sa_brick
    name: Fireclay brick Refarom 65 SA, 230x114x64 mm
    category: refractory_dense
    product:
      manufacturer: SC REFAROM SA, Brasov, Romania
      product_name: Caramida refractara 65 SA (sold by Hornbach as "Helios R-65SA")
      grade: "65 SA, SiO2 >= 65 % (siliceous-aluminous fireclay)"
      format_mm: [230, 114, 64]
    suppliers:
      - name: HORNBACH Romania
        url: https://www.hornbach.ro/p/caramida-refractara-samota-helios-r-65sa-230x114x64-mm/8190823/
        price: 5.74
        currency: RON
        per: piece
        date_checked: 2026-11-07
        notes: "5.55 RON/piece from 322 pcs. Stock seen for Domnesti (Ilfov); check local store stock. 230x114x32 splits also listed (product 8190824)."
    notes: >
      The manufacturer datasheet gives no thermal properties. k, rho, cp and expansion
      are taken as ASSUMPTION from the closest fully documented European fireclay grade
      (Haasser H3, 30-35 % Al2O3, open porosity 19-23 %, vs Refarom porosity <= 24 %).
      Requesting a full datasheet from Refarom (import@refarom.ro) would close this gap.
    properties:
      max_service_temperature:
        unit: degC
        value: 1150
        confidence: DATASHEET
        uncertainty: {rel_low: 0.05, rel_high: 0.0}
        source:
          title: Hornbach product listing 8190823 ("rezistent la foc pana la 1150 C")
          url: https://www.hornbach.ro/p/caramida-refractara-samota-helios-r-65sa-230x114x64-mm/8190823/
          accessed: 2026-11-07
      porosity:
        unit: dimensionless
        value: 0.24
        confidence: DATASHEET
        uncertainty: {rel_low: 0.3, rel_high: 0.0}
        source: &refarom_ds
          title: REFAROM Fisa tehnica Caramida refractara 65 SA (apparent porosity max 24 %)
          url: https://media.hornbach.ro/hb/technicaldatasheet/as.94214579.pdf
          locator: Caracteristici tehnice
          accessed: 2026-11-07
          file: sources/hornbach_samota_230x114x64_fisa_tehnica.pdf
      cold_crushing_strength:
        unit: N/mm**2
        value: 20
        confidence: DATASHEET
        uncertainty: {rel_low: 0.0, rel_high: 1.0}
        reasoning: datasheet gives a minimum; real value is >= 20
        source: *refarom_ds
      thermal_conductivity:
        unit: W/(m*K)
        data:
          - {T_C: 400, value: 1.20}
          - {T_C: 700, value: 1.25}
          - {T_C: 1100, value: 1.35}
        confidence: ASSUMPTION
        reasoning: >
          Proxy: Haasser H3 (ASTM C202), the closest documented grade by alumina and
          porosity. Bony B40SR (denser, 40-42 % Al2O3) gives 1.48/1.45/1.50 at
          200/400/600 C, i.e. k is nearly flat from 200 to 400 C; holding the 400 C
          value constant below 400 C is therefore a reasonable recorded extrapolation.
          A more porous brick conducts less, hence the wider low-side band.
        uncertainty: {rel_low: 0.30, rel_high: 0.25}
        source: &haasser
          title: HAASSER Produits Refractaires, fiche Refractaires faconnes denses - Argileux, grades H3/H2/H1/HO
          url: https://forums.futura-sciences.com/attachments/habitat-bioclimatique-isolation-chauffage/187061d1340917612-construction-realiste-dun-poele-de-masse-ft-h1.pdf
          locator: column H3
          accessed: 2026-11-07
          file: sources/fireclay_ft_h1_futura.pdf
      density:
        unit: g/cm**3
        value: 2.05
        confidence: ASSUMPTION
        reasoning: Proxy Haasser H3 bulk density (2.05 t/m3); comparable fireclay grades are 2.0-2.25.
        uncertainty: {rel_low: 0.05, rel_high: 0.08}
        source: *haasser
      specific_heat:
        unit: kJ/(kg*K)
        value: 1.06
        confidence: ASSUMPTION
        reasoning: >
          Proxy Haasser H3 mean specific heat 20-1100 C. Durrath COR 30 gives a mean of
          0.96 kJ/kgK over 20-400 C, closer to our operating range, hence the low-side band.
        uncertainty: {rel_low: 0.12, rel_high: 0.05}
        source: *haasser
      thermal_expansion:
        unit: 1/delta_degC
        value: 7.5e-6
        confidence: ASSUMPTION
        reasoning: Proxy Haasser H3. Bony B40SR shows 0.26 % at 400 C (~6.5e-6/K mean).
        uncertainty: {rel: 0.2}
        source: *haasser
      emissivity:
        unit: dimensionless
        data:
          - {T_C: 400, value: 0.8327}
          - {T_C: 1400, value: 0.7327}
        confidence: REFERENCE
        reasoning: >
          IFRF correlation e = 0.9 - 1e-4*T[K] for low-Al2O3 fireclay, valid 673-1673 K
          (points evaluated at the range ends). The medium-Al2O3 correlation
          (0.84 - 2e-4*T) gives ~16 % less at 450 C, covered by the low-side band.
          Cross-check - Optris table lists fireclay 0.73 at 1000 C (correlation 0.77).
          Held constant below 400 C (recorded extrapolation, K-23).
        uncertainty: {rel_low: 0.20, rel_high: 0.05}
        source:
          title: IFRF Online Combustion Handbook - emissivity of firebrick and refractories vs temperature (cites Osborn, Handbook of Energy Data and Calculations, Butterworth 1985)
          url: https://ifrf.net/?p=8893
          locator: fireclay/firebrick, low Al2O3 row
          accessed: 2026-11-07

