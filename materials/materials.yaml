  # ------------------------------------------------------------------ insulation
  - id: superwool_plus_blanket_128
    name: Morgan Thermal Ceramics Superwool Plus blanket, 128 kg/m3 (AES, bio-soluble)
    category: insulation
    product:
      manufacturer: Morgan Advanced Materials - Thermal Ceramics
      product_name: Superwool Plus Blanket
      grade: 128 kg/m3; thicknesses 6-50 mm; 25 mm roll 610 mm x 7.32 m (4.46 m2)
    suppliers:
      - name: Textile Technologies (EU online)
        url: https://www.textiletechnologies.co.uk/en-de/products/morgan-superwool-plus-blanket
        price: 139.95
        currency: EUR
        per: roll 25 mm x 610 mm x 7.32 m
        date_checked: 2026-11-07
        notes: From search-result snippet; listing title says 96 kg/m3 while SKU says 128 - confirm density before ordering. No Romanian stockist found yet.
    notes: >
      Not classified as carcinogenic in the EU (Note Q, EC 1272/2008) per the datasheet -
      satisfies R-S5. Datasheet has no k below 200 C mean; the cold side of the
      insulation runs below that, so the 200 C value is used as an upper bound there
      (conservative for heat loss, recorded in risks K-17).
    properties:
      thermal_conductivity:
        unit: W/(m*K)
        data:
          - {T_C: 200, value: 0.05}
          - {T_C: 400, value: 0.08}
          - {T_C: 600, value: 0.12}
          - {T_C: 800, value: 0.18}
          - {T_C: 1000, value: 0.25}
        confidence: DATASHEET
        uncertainty: {rel_low: 0.10, rel_high: 0.20}
        source: &superwool
          title: Superwool Plus Blanket Product Data Sheet, code BL.01, published 18 April 2025 (ASTM C201)
          url: https://morganthermalceramics.com/media/5855/3-superwool-plus-blanket.pdf
          locator: p.2, Thermal Conductivity table, 128 kg/m3 column
          accessed: 2026-11-07
          file: sources/morgan_superwool_plus_blanket_2025-04.pdf
      density:
        unit: kg/m**3
        value: 128
        confidence: DATASHEET
        uncertainty: {rel: 0.10}
        source: *superwool
      max_service_temperature:
        unit: degC
        value: 1050
        confidence: DATASHEET
        uncertainty: {rel: 0.0}
        reasoning: continuous use temperature (classification temperature is 1200 C)
        source: *superwool
      specific_heat:
        unit: kJ/(kg*K)
        value: 1.0
        confidence: ASSUMPTION
        reasoning: >
          Not on the datasheet. Silicate refractories of similar oxide make-up have mean cp
          0.96-1.06 kJ/kgK (Durrath COR 30, Haasser H3). At 128 kg/m3 the blanket's heat
          capacity is small, so the effect on heat-up is minor (checked in sensitivity).
        uncertainty: {rel: 0.2}
        source: *haasser

  - id: casi_board_cs270
    name: Calcium silicate board CS-270, 1200x600x25 mm (Hornbach "placa alba izolare semineu 25 mm")
    category: insulation
    product:
      product_name: Placa silicat de calciu 1000 (CS-270)
      format_mm: [1200, 600, 25]
    suppliers:
      - name: HORNBACH Romania
        url: https://www.hornbach.ro/p/placa-alba-izolare-semineu-25-mm/10735373/
        price: 94.00
        currency: RON
        per: sheet 1200x600x25 mm (0.72 m2)
        date_checked: 2026-11-07
        notes: The listing links two datasheets (CS-270 and ROKASIL-1100, the latter without k). Confirm in store which board is supplied.
    notes: >
      Datasheet gives k <= 0.056 + 0.00011 t (W/mK), t = mean of hot and cold face in C.
      For a linear k(T), the mean-temperature form equals the local form, so the data
      points below are the local k(T). The datasheet value is an upper bound, hence the
      one-sided uncertainty.
    properties:
      thermal_conductivity:
        unit: W/(m*K)
        data:
          - {T_C: 0, value: 0.056}
          - {T_C: 1000, value: 0.166}
        confidence: DATASHEET
        uncertainty: {rel_low: 0.30, rel_high: 0.0}
        source: &casi
          title: Placa silicat de calciu 1000, CS-270 technical sheet (Hornbach)
          url: https://media.hornbach.ro/hb/technicaldatasheet/as.79048420.pdf
          locator: Proprietati fizice table
          accessed: 2026-11-07
          file: sources/hornbach_casi_board_25mm_a.pdf
      density:
        unit: kg/m**3
        value: 270
        confidence: DATASHEET
        uncertainty: {rel: 0.10}
        source: *casi
      max_service_temperature:
        unit: degC
        value: 1050
        confidence: DATASHEET
        uncertainty: {rel: 0.0}
        source: *casi
      permanent_linear_change:
        unit: dimensionless
        value: 0.015
        confidence: DATASHEET
        uncertainty: {rel_low: 0.9, rel_high: 0.0}
        reasoning: datasheet gives shrinkage <= 1.5 % after 3 h at 1000 C (upper bound)
        source: *casi
      specific_heat:
        unit: kJ/(kg*K)
        value: 1.0
        confidence: ASSUMPTION
        reasoning: Not on the datasheet; proxy from silicate refractories (0.96-1.06 kJ/kgK, Durrath COR 30 / Haasser H3). Low-density board, minor effect.
        uncertainty: {rel: 0.2}
        source: *haasser

